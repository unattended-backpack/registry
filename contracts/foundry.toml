[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.36"
optimizer = true
optimizer_runs = 200
evm_version = "prague"

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 50
fail_on_revert = true

[soldeer]
remappings_generate = false

[dependencies]
forge-std = "1.16.2"
solady = "0.1.26"
